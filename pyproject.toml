[project]
name = "analisador"
version = "0.1.0"
description = "Analisador preditivo de ações com grau de confiabilidade mensurado fora da amostra"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "yfinance==1.7.0",
    "requests==2.34.2",
    "pyarrow==26.0.0",
    "arch==8.0.0",
    "hmmlearn==0.3.3",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    "shap==0.54.1",
    "plotly==7.1.0",
    "pyyaml==6.0.3",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.66.1"]
fundacionais = ["torch", "chronos-forecasting"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analisador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["lento: testes que treinam modelos de verdade (rodam por padrão)"]
